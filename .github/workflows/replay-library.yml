name: Import historical replay library
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      years:
        description: "Ended GP seasons, newest first (2023 onward)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: replay-library-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/restore-replays.js
      - name: Import, validate and publish each completed race
        run: |
          args=(--include-sprints --publish)
          if [ -n "$IMPORT_YEARS" ]; then args+=(--years "$IMPORT_YEARS"); fi
          node --expose-gc scripts/import-replay-library.js "${args[@]}"
        env:
          IMPORT_YEARS: ${{ inputs.years }}
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-import-progress
          path: .cache/replay-expansion/progress.json
